{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vexa.componentName" (list . "migrations") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
  # post-install waits until chart-managed credentials exist on first install. pre-upgrade runs
  # the new image's monotonic schema convergence before replacing service Pods. Keeping this a
  # hook also avoids immutable Job-template patches across image promotions.
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "vexa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
      annotations:
        checksum/platform-secret: {{ include "vexa.secretRolloutChecksum" . | quote }}
        checksum/database-secret: {{ include "vexa.databaseSecretRolloutChecksum" . | quote }}
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml (mergeOverwrite (deepCopy .Values.global.podSecurityContext) (dict "fsGroup" (int .Values.adminApi.runAsUser) "fsGroupChangePolicy" "OnRootMismatch" "runAsGroup" (int .Values.adminApi.runAsUser) "runAsNonRoot" true "runAsUser" (int .Values.adminApi.runAsUser))) | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrations
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy .Values.global.securityContext) (dict "allowPrivilegeEscalation" false "capabilities" (dict "add" (list) "drop" (list "ALL")) "readOnlyRootFilesystem" true "runAsGroup" (int .Values.adminApi.runAsUser) "runAsNonRoot" true "runAsUser" (int .Values.adminApi.runAsUser))) | nindent 12 }}
          {{- $migrationImage := deepCopy .Values.migrations.image -}}
          {{- if not $migrationImage.repository }}
          {{- $migrationImage = deepCopy .Values.adminApi.image -}}
          {{- end }}
          image: {{ include "vexa.imageRef" (list . $migrationImage) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - python
            - -m
            - admin_api.migrate
          env:
            - name: DB_HOST
              value: {{ include "vexa.dbHostEffective" . | quote }}
            - name: DB_PORT
              value: {{ include "vexa.dbPortEffective" . | quote }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_USER
            - name: DB_SSL_MODE
              value: {{ .Values.database.sslMode | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_PASSWORD
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- /* v0.10.5 Pack A.1 — restore tolerations/nodeSelector/affinity (#272 issue 2; was never on Job spec). */}}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
