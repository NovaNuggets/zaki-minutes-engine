{{- $reservedRuntimeEnv := list
  "RUNTIME_BACKEND" "RUNTIME_AGENT_PROFILE_ENABLED" "POD_NAMESPACE" "DOCKER_NETWORK"
  "REDIS_URL" "BROWSER_IMAGE" "MINUTES_BROWSER_IMAGE" "AGENT_IMAGE" "AGENT_WORKER_IMAGE"
  "RUNTIME_CONTROL_SECRET" "RUNTIME_CALLBACK_SECRET" "RUNTIME_CALLBACK_TRUSTED_ORIGINS"
  "RUNTIME_K8S_NODE_SELECTOR_JSON" "RUNTIME_K8S_TOLERATIONS_JSON"
  "RUNTIME_K8S_AFFINITY_JSON" "RUNTIME_K8S_IMAGE_PULL_SECRETS_JSON"
  "RUNTIME_K8S_IMAGE_PULL_POLICY" "RUNTIME_K8S_RUN_AS_USER"
  "RUNTIME_K8S_BOT_RUN_AS_USER" "RUNTIME_K8S_BOT_RUN_AS_GROUP" "RUNTIME_K8S_BOT_FS_GROUP"
  "RUNTIME_K8S_AGENT_RUN_AS_USER" "RUNTIME_K8S_AGENT_RUN_AS_GROUP" "RUNTIME_K8S_AGENT_FS_GROUP"
  "RUNTIME_K8S_DEFAULT_CPU" "RUNTIME_K8S_DEFAULT_MEMORY_MB"
  "RUNTIME_K8S_MAX_CPU" "RUNTIME_K8S_MAX_MEMORY_MB" "RUNTIME_K8S_MAX_GPU"
  "ANTHROPIC_API_KEY" "ANTHROPIC_AUTH_TOKEN" "ANTHROPIC_BASE_URL" "ANTHROPIC_MODEL"
  "ANTHROPIC_DEFAULT_OPUS_MODEL" "ANTHROPIC_DEFAULT_SONNET_MODEL"
  "ANTHROPIC_DEFAULT_HAIKU_MODEL" "LOG_LEVEL"
  "ADMIN_TOKEN" "ADMIN_API_TOKEN" "INTERNAL_API_SECRET" "MEETING_TOKEN_SECRET"
  "REDIS_PASSWORD" "VEXA_DISPATCH_SIGNING_KEY" "VEXA_BOT_API_KEY" "CLAUDE_CODE_OAUTH_TOKEN"
  "ZAKI_READ_TOKEN_MINUTES"
-}}
{{- if .Values.runtime.enabled -}}
{{- range .Values.runtime.extraEnv -}}
  {{- $name := toString (.name | default "") -}}
  {{- if or (has $name $reservedRuntimeEnv) (hasPrefix "ZAKI_MINUTES_" $name) (hasPrefix "ZAKI_AGENT_ERASURE_" $name) (hasPrefix "MINUTES_" $name) -}}
  {{- fail (printf "runtime.extraEnv may not override reserved runtime authentication setting %s; use the chart field and operator Secret" $name) -}}
  {{- end -}}
{{- end -}}
{{- end -}}
{{- $runtimePodSecurityContext := mergeOverwrite (deepCopy .Values.global.podSecurityContext) (dict "fsGroup" (int .Values.runtime.runAsUser) "fsGroupChangePolicy" "OnRootMismatch") -}}
{{- if eq .Values.runtime.backend "docker" -}}
  {{- $_ := set $runtimePodSecurityContext "supplementalGroups" (list (int .Values.runtime.dockerSocketGroup)) -}}
{{- end -}}
{{- if .Values.runtime.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vexa.componentName" (list . "runtime") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.runtime.replicaCount }}
  {{- include "vexa.deploymentStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "vexa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: runtime
  template:
    metadata:
      labels:
        {{- include "vexa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: runtime
      annotations:
        checksum/platform-secret: {{ include "vexa.secretRolloutChecksum" . | quote }}
        {{- with .Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml $runtimePodSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .Values.runtime.backend "k8s" }}
      # The runtime spawns bot/agent Pods via kubectl — bind the SA carrying the pod-spawn RBAC.
      serviceAccountName: {{ include "vexa.componentName" (list . "runtime") }}
      {{- end }}
      containers:
        - name: runtime
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy .Values.global.securityContext) (dict "allowPrivilegeEscalation" false "capabilities" (dict "add" (list) "drop" (list "ALL")) "runAsGroup" (int .Values.runtime.runAsUser) "runAsNonRoot" true "runAsUser" (int .Values.runtime.runAsUser) "readOnlyRootFilesystem" true)) | nindent 12 }}
          image: {{ include "vexa.imageRef" (list . .Values.runtime.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: RUNTIME_BACKEND
              value: {{ .Values.runtime.backend | quote }}
            - name: RUNTIME_AGENT_PROFILE_ENABLED
              value: {{ .Values.agentApi.enabled | quote }}
            {{- if eq .Values.runtime.backend "k8s" }}
            - name: POD_NAMESPACE
              value: {{ include "vexa.workloadNamespace" . | quote }}
            # Operator-owned policy for every ephemeral bot/worker Pod. These values are serialized
            # by Helm and read only from the runtime process environment; workload specs cannot
            # override placement, registry, identity, or resource ceilings.
            - name: RUNTIME_K8S_NODE_SELECTOR_JSON
              value: {{ toJson .Values.global.nodeSelector | quote }}
            - name: RUNTIME_K8S_TOLERATIONS_JSON
              value: {{ toJson .Values.global.tolerations | quote }}
            - name: RUNTIME_K8S_AFFINITY_JSON
              value: {{ toJson .Values.global.affinity | quote }}
            - name: RUNTIME_K8S_IMAGE_PULL_SECRETS_JSON
              value: {{ toJson .Values.global.imagePullSecrets | quote }}
            - name: RUNTIME_K8S_IMAGE_PULL_POLICY
              value: {{ .Values.global.imagePullPolicy | quote }}
            - name: RUNTIME_K8S_RUN_AS_USER
              value: {{ .Values.runtime.spawnedPods.botIdentity.runAsUser | quote }}
            - name: RUNTIME_K8S_BOT_RUN_AS_USER
              value: {{ .Values.runtime.spawnedPods.botIdentity.runAsUser | quote }}
            - name: RUNTIME_K8S_BOT_RUN_AS_GROUP
              value: {{ .Values.runtime.spawnedPods.botIdentity.runAsGroup | quote }}
            - name: RUNTIME_K8S_BOT_FS_GROUP
              value: {{ .Values.runtime.spawnedPods.botIdentity.fsGroup | quote }}
            - name: RUNTIME_K8S_AGENT_RUN_AS_USER
              value: {{ .Values.runtime.spawnedPods.agentIdentity.runAsUser | quote }}
            - name: RUNTIME_K8S_AGENT_RUN_AS_GROUP
              value: {{ .Values.runtime.spawnedPods.agentIdentity.runAsGroup | quote }}
            - name: RUNTIME_K8S_AGENT_FS_GROUP
              value: {{ .Values.runtime.spawnedPods.agentIdentity.fsGroup | quote }}
            - name: RUNTIME_K8S_DEFAULT_CPU
              value: {{ .Values.runtime.spawnedPods.defaultCpu | quote }}
            - name: RUNTIME_K8S_DEFAULT_MEMORY_MB
              value: {{ .Values.runtime.spawnedPods.defaultMemoryMb | quote }}
            - name: RUNTIME_K8S_MAX_CPU
              value: {{ .Values.runtime.spawnedPods.maxCpu | quote }}
            - name: RUNTIME_K8S_MAX_MEMORY_MB
              value: {{ .Values.runtime.spawnedPods.maxMemoryMb | quote }}
            - name: RUNTIME_K8S_MAX_GPU
              value: {{ .Values.runtime.spawnedPods.maxGpu | quote }}
            {{- end }}
            {{- if eq .Values.runtime.backend "docker" }}
            # The spawned bot/worker join the runtime's namespace network. On k8s the kernel resolves
            # services by DNS; DOCKER_NETWORK only matters for the docker backend (single-node fallback).
            - name: DOCKER_NETWORK
              value: {{ .Values.runtime.dockerNetwork | default "" | quote }}
            {{- end }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: REDIS_URL
            - name: BROWSER_IMAGE
              value: {{ include "vexa.botImage" . | quote }}
            {{- if .Values.minutes.invocationV2Enabled }}
            - name: MINUTES_BROWSER_IMAGE
              value: {{ .Values.minutes.botImage | quote }}
            {{- end }}
            {{- if .Values.agentApi.enabled }}
            - name: AGENT_IMAGE
              value: {{ include "vexa.agentImage" . | quote }}
            - name: AGENT_WORKER_IMAGE
              value: {{ include "vexa.agentWorkerImage" . | quote }}
            {{- end }}
            - name: RUNTIME_CONTROL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: RUNTIME_CONTROL_SECRET
            - name: RUNTIME_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: RUNTIME_CALLBACK_SECRET
            - name: RUNTIME_CALLBACK_TRUSTED_ORIGINS
              value: "http://{{ include "vexa.componentName" (list . "meeting-api") }}:{{ .Values.meetingApi.service.port }}"
            {{- if .Values.agentApi.enabled }}
            # Runtime brokers model auth only for the bundled Agent-worker profile. Managed Minutes
            # disables that profile, so its runtime must not receive dormant provider credentials.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: ANTHROPIC_AUTH_TOKEN
                  optional: true
            - name: ANTHROPIC_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: ANTHROPIC_BASE_URL
                  optional: true
            - name: ANTHROPIC_MODEL
              value: {{ .Values.models.anthropicModel | default "" | quote }}
            - name: ANTHROPIC_DEFAULT_OPUS_MODEL
              value: {{ .Values.models.anthropicOpusModel | default "" | quote }}
            - name: ANTHROPIC_DEFAULT_SONNET_MODEL
              value: {{ .Values.models.anthropicSonnetModel | default "" | quote }}
            - name: ANTHROPIC_DEFAULT_HAIKU_MODEL
              value: {{ .Values.models.anthropicHaikuModel | default "" | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.runtime.logLevel | default "info" | quote }}
            {{- with .Values.runtime.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- if eq .Values.runtime.backend "docker" }}
            - name: docker-sock
              mountPath: /var/run/docker.sock
          {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.runtime.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- if eq .Values.runtime.backend "docker" }}
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
      {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
