{{- if and (or $hardened $minutesErasure) .Values.minio.enabled (or (and (eq $minioImageDigest "") (eq (lower $minioImageTag) "latest")) (and (eq $minioClientDigest "") (eq (lower $minioClientTag) "latest"))) -}}
