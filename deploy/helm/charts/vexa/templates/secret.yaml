{{- $minutesErasure := or .Values.minutes.captureEnabled .Values.minutes.invocationV2Enabled (ne $minutesBotImage "") $minutesRead $minutesFinalized .Values.minutes.ttl.enabled $minutesBoundaryMaterial -}}
