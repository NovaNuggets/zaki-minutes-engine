{{- if $deploymentHardened -}}
  {{- $requiredImages := list -}}
  {{- if .Values.gateway.enabled }}{{- $requiredImages = append $requiredImages (include "vexa.imageRef" (list . .Values.gateway.image)) -}}{{- end -}}
  {{- if .Values.adminApi.enabled }}{{- $requiredImages = append $requiredImages (include "vexa.imageRef" (list . .Values.adminApi.image)) -}}{{- end -}}
  {{- if .Values.meetingApi.enabled }}{{- $requiredImages = append $requiredImages (include "vexa.imageRef" (list . .Values.meetingApi.image)) -}}{{- end -}}
  {{- if .Values.runtime.enabled }}{{- $requiredImages = append $requiredImages (include "vexa.imageRef" (list . .Values.runtime.image)) -}}{{- end -}}
  {{- if .Values.agentApi.enabled }}{{- $requiredImages = append $requiredImages (include "vexa.imageRef" (list . .Values.agentApi.image)) -}}{{- end -}}
  {{- if .Values.terminal.enabled }}{{- $requiredImages = append $requiredImages (include "vexa.imageRef" (list . .Values.terminal.image)) -}}{{- end -}}
  {{- if .Values.postgres.enabled }}{{- $requiredImages = append $requiredImages .Values.postgres.image -}}{{- end -}}
  {{- if .Values.redis.enabled }}{{- $requiredImages = append $requiredImages .Values.redis.image -}}{{- end -}}
  {{- if .Values.minio.enabled -}}
    {{- $requiredImages = append $requiredImages (include "vexa.dependencyImageRef" (list .Values.minio.image)) -}}
    {{- $requiredImages = append $requiredImages (include "vexa.dependencyImageRef" (list .Values.minio.clientImage)) -}}
  {{- end -}}
  {{- if .Values.pgbouncer.enabled }}{{- $requiredImages = append $requiredImages .Values.pgbouncer.image -}}{{- end -}}
  {{- if .Values.meetingApi.enabled }}{{- $requiredImages = append $requiredImages (include "vexa.botImage" .) -}}{{- end -}}
  {{- if .Values.agentApi.enabled -}}
    {{- $requiredImages = append $requiredImages (include "vexa.agentImage" .) -}}
    {{- $requiredImages = append $requiredImages (include "vexa.agentWorkerImage" .) -}}
  {{- end -}}
  {{- if and .Values.minutes.invocationV2Enabled (ne $minutesBotImage "") }}{{- $requiredImages = append $requiredImages $minutesBotImage -}}{{- end -}}
  {{- range $imageRef := $requiredImages -}}
    {{- if not (regexMatch $immutableImageRef (trim (toString $imageRef))) -}}
