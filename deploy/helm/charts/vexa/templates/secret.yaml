{{- if and .Values.meetingApi.enabled (lt (int .Values.meetingApi.replicaCount) 1) -}}
{{- fail "meetingApi.enabled=true requires meetingApi.replicaCount>=1" -}}
{{- end -}}
{{- if and .Values.runtime.enabled (lt (int .Values.runtime.replicaCount) 1) -}}
{{- fail "runtime.enabled=true requires runtime.replicaCount>=1" -}}
{{- end -}}
{{- if and .Values.agentApi.enabled (lt (int .Values.agentApi.replicaCount) 1) -}}
{{- fail "agentApi.enabled=true requires agentApi.replicaCount>=1" -}}
