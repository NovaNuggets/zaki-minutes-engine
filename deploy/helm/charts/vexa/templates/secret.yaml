{{- if and .Values.minio.enabled (or (eq $minioImageRepository "") (and (eq $minioImageDigest "") (eq $minioImageTag "")) (eq $minioClientRepository "") (and (eq $minioClientDigest "") (eq $minioClientTag ""))) -}}
