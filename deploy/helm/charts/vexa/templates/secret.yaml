  {{- fail "secrets.runtimeCallbackSecret must be distinct from internal, runtime control, MeetingToken, and Redis credentials" -}}
  {{- end -}}
  {{- if or (eq $meetingTokenSecret $adminSecret) (eq $meetingTokenSecret $internalSecret) (eq $meetingTokenSecret $runtimeControlSecret) (eq $meetingTokenSecret $runtimeCallbackSecret) (eq $meetingTokenSecret $redisPassword) -}}
  {{- fail "secrets.meetingTokenSecret must be distinct from admin, internal, runtime, callback, and Redis credentials" -}}
  {{- end -}}
{{- end -}}
{{- if and .Values.minutes.captureEnabled (not .Values.minutes.invocationV2Enabled) -}}
  {{- fail "minutes.captureEnabled requires minutes.invocationV2Enabled=true" -}}
{{- end -}}
{{- if and .Values.minutes.invocationV2Enabled (eq $minutesBotImage "") -}}
  {{- fail "minutes.invocationV2Enabled requires an explicit minutes.botImage" -}}
{{- end -}}
{{- if and (ne $minutesBotImage "") (not .Values.minutes.invocationV2Enabled) -}}
  {{- fail "minutes.botImage requires minutes.invocationV2Enabled=true" -}}
{{- end -}}
{{- if ne $minutesBotImageRaw $minutesBotImage -}}
  {{- fail "minutes.botImage must not contain outer whitespace" -}}
{{- end -}}
{{- if and $minutesErasure (not .Values.minutes.ttl.enabled) -}}
{{- fail "managed Minutes data/erasure requires minutes.ttl.enabled=true" -}}
{{- end -}}
{{- if $minutesErasure -}}
  {{- $bundledAgentUrl := printf "http://%s:%v" (include "vexa.componentName" (list . "agent-api")) .Values.agentApi.service.port -}}
  {{- if or (ne $nullalisErasureBaseUrlRaw $nullalisErasureBaseUrl) (ne $agentErasureKeyIdRaw $agentErasureKeyId) (ne $minutesErasureKeyIdRaw $minutesErasureKeyId) (ne $previousAgentErasureKeyIdRaw $previousAgentErasureKeyId) (ne $previousMinutesErasureKeyIdRaw $previousMinutesErasureKeyId) -}}
  {{- fail "Minutes URLs and key identifiers must not contain outer whitespace" -}}
  {{- end -}}
  {{- if eq $nullalisErasureBaseUrl "" -}}
  {{- fail "Minutes activation/historical erasure requires minutes.nullalisErasureBaseUrl for external Nullalis" -}}
  {{- end -}}
  {{- if not (regexMatch "^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[^?#]*)?$" $nullalisErasureBaseUrl) -}}
  {{- fail "minutes.nullalisErasureBaseUrl must be an unambiguous HTTP(S) base URL without credentials, query, or fragment" -}}
  {{- end -}}
  {{- $nullalisWithoutScheme := regexReplaceAll "^https?://" $nullalisErasureBaseUrl "" -}}
  {{- $nullalisAuthority := first (splitList "/" $nullalisWithoutScheme) -}}
  {{- $nullalisHostPort := splitList ":" $nullalisAuthority -}}
  {{- if eq (len $nullalisHostPort) 2 -}}
    {{- $nullalisPort := atoi (index $nullalisHostPort 1) -}}
    {{- if or (lt $nullalisPort 1) (gt $nullalisPort 65535) -}}
    {{- fail "minutes.nullalisErasureBaseUrl port must be in 1..65535" -}}
    {{- end -}}
  {{- end -}}
  {{- if eq (trimSuffix "/" $nullalisErasureBaseUrl) $bundledAgentUrl -}}
  {{- fail "minutes.nullalisErasureBaseUrl must target external Nullalis, not the bundled agent-api Service" -}}
  {{- end -}}
{{- end -}}
{{- if $minutesRead -}}
  {{- $minutesSecretRef := lower (trim (toString .Values.secrets.existingSecretName)) -}}
  {{- if ne $minutesSecretRef "" -}}
    {{- if has $minutesSecretRef (list "change_me" "change-me" "changeme" "your-secret-name") -}}
    {{- fail "minutes.readEnabled requires a non-placeholder secrets.existingSecretName" -}}
    {{- end -}}
  {{- else -}}
    {{- $minutesReadTokenLower := lower $minutesReadToken -}}
    {{- if ne $minutesReadTokenRaw $minutesReadToken -}}
    {{- fail "secrets.minutesReadToken must not contain outer whitespace" -}}
    {{- end -}}
    {{- if or (eq $minutesReadToken "") (has $minutesReadTokenLower (list "change_me" "changeme" "dev-minutes-read-token" "test-minutes-read-token" "your_minutes_read_token_here")) -}}
    {{- fail "minutes.readEnabled requires a non-placeholder secrets.minutesReadToken or secrets.existingSecretName" -}}
    {{- end -}}
    {{- if has $minutesReadToken $platformCredentials -}}
    {{- fail "secrets.minutesReadToken must be distinct from platform signing, provider, and storage credentials" -}}
    {{- end -}}
    {{- if not (regexMatch $boundedOperatorSecret $minutesReadToken) -}}
    {{- fail "secrets.minutesReadToken must contain 32..512 unpadded printable-ASCII characters" -}}
    {{- end -}}
    {{- if and $minutesErasure (or (eq $minutesReadToken $agentErasureSecret) (eq $minutesReadToken $minutesErasureSecret)) -}}
    {{- fail "secrets.minutesReadToken must be distinct from erasure secrets" -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if $minutesErasure -}}
  {{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" $agentErasureKeyId) -}}
  {{- fail "Minutes erasure requires minutes.agentErasureKeyId" -}}
  {{- end -}}
  {{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" $minutesErasureKeyId) -}}
  {{- fail "Minutes erasure requires minutes.minutesErasureKeyId" -}}
  {{- end -}}
  {{- if eq $agentErasureKeyId $minutesErasureKeyId -}}
  {{- fail "Minutes and Agent erasure key identifiers must be independent" -}}
  {{- end -}}
  {{- if ne $previousAgentErasureKeyId "" -}}
    {{- if or (not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" $previousAgentErasureKeyId)) (has $previousAgentErasureKeyId (list $agentErasureKeyId $minutesErasureKeyId)) -}}
    {{- fail "minutes.previousAgentErasureKeyId must be a distinct valid key identifier" -}}
    {{- end -}}
  {{- end -}}
  {{- if ne $previousMinutesErasureKeyId "" -}}
    {{- if or (not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" $previousMinutesErasureKeyId)) (has $previousMinutesErasureKeyId (list $agentErasureKeyId $minutesErasureKeyId $previousAgentErasureKeyId)) -}}
    {{- fail "minutes.previousMinutesErasureKeyId must be a distinct valid key identifier" -}}
    {{- end -}}
  {{- end -}}
  {{- if eq $operatorSecretRef "" -}}
    {{- if or (ne $minutesHubTokenRaw $minutesHubToken) (ne $agentErasureSecretRaw $agentErasureSecret) (ne $previousAgentErasureSecretRaw $previousAgentErasureSecret) (ne $minutesErasureSecretRaw $minutesErasureSecret) (ne $previousMinutesErasureSecretRaw $previousMinutesErasureSecret) -}}
    {{- fail "inline Minutes erasure credentials must not contain outer whitespace" -}}
    {{- end -}}
    {{- if eq $minutesHubToken "" -}}
    {{- fail "managed Minutes routes require secrets.minutesHubToken or secrets.existingSecretName" -}}
    {{- end -}}
    {{- if eq $agentErasureSecret "" -}}
    {{- fail "Minutes erasure requires secrets.agentErasureHmacSecret or secrets.existingSecretName" -}}
    {{- end -}}
    {{- if eq $minutesErasureSecret "" -}}
    {{- fail "Minutes erasure requires secrets.minutesErasureSigningSecret or secrets.existingSecretName" -}}
    {{- end -}}
    {{- if not (regexMatch $boundedOperatorSecret $minutesHubToken) -}}
    {{- fail "secrets.minutesHubToken must contain 32..512 unpadded printable-ASCII characters" -}}
    {{- end -}}
    {{- if not (regexMatch $boundedOperatorSecret $agentErasureSecret) -}}
    {{- fail "secrets.agentErasureHmacSecret must contain 32..512 unpadded printable-ASCII characters" -}}
    {{- end -}}
    {{- if not (regexMatch $boundedOperatorSecret $minutesErasureSecret) -}}
    {{- fail "secrets.minutesErasureSigningSecret must contain 32..512 unpadded printable-ASCII characters" -}}
    {{- end -}}
    {{- if ne $previousAgentErasureKeyId "" -}}
      {{- if eq $previousAgentErasureSecret "" -}}
      {{- fail "minutes.previousAgentErasureKeyId requires secrets.agentErasurePreviousVerificationSecret" -}}
      {{- end -}}
      {{- if not (regexMatch $boundedOperatorSecret $previousAgentErasureSecret) -}}
      {{- fail "secrets.agentErasurePreviousVerificationSecret must contain 32..512 unpadded printable-ASCII characters" -}}
      {{- end -}}
    {{- else if ne $previousAgentErasureSecret "" -}}
    {{- fail "secrets.agentErasurePreviousVerificationSecret requires minutes.previousAgentErasureKeyId" -}}
    {{- end -}}
    {{- if ne $previousMinutesErasureKeyId "" -}}
      {{- if eq $previousMinutesErasureSecret "" -}}
      {{- fail "minutes.previousMinutesErasureKeyId requires secrets.minutesErasurePreviousVerificationSecret" -}}
      {{- end -}}
      {{- if not (regexMatch $boundedOperatorSecret $previousMinutesErasureSecret) -}}
      {{- fail "secrets.minutesErasurePreviousVerificationSecret must contain 32..512 unpadded printable-ASCII characters" -}}
      {{- end -}}
    {{- else if ne $previousMinutesErasureSecret "" -}}
    {{- fail "secrets.minutesErasurePreviousVerificationSecret requires minutes.previousMinutesErasureKeyId" -}}
    {{- end -}}
    {{- $inlineMinutesCredentials := list
      (dict "name" "secrets.minutesHubToken" "value" $minutesHubToken)
      (dict "name" "secrets.minutesReadToken" "value" $minutesReadToken)
      (dict "name" "secrets.agentErasureHmacSecret" "value" $agentErasureSecret)
      (dict "name" "secrets.agentErasurePreviousVerificationSecret" "value" $previousAgentErasureSecret)
      (dict "name" "secrets.minutesErasureSigningSecret" "value" $minutesErasureSecret)
      (dict "name" "secrets.minutesErasurePreviousVerificationSecret" "value" $previousMinutesErasureSecret)
      (dict "name" "secrets.minutesFinalizedSecret" "value" $minutesFinalizedSecret)
    -}}
    {{- $seenMinutesCredentials := dict -}}
    {{- range $credential := $inlineMinutesCredentials -}}
      {{- $credentialName := get $credential "name" -}}
      {{- $credentialValue := get $credential "value" -}}
      {{- if ne $credentialValue "" -}}
        {{- if has $credentialValue $platformCredentials -}}
        {{- fail (printf "%s must be distinct from every platform signing, provider, and storage credential" $credentialName) -}}
        {{- end -}}
        {{- if hasKey $seenMinutesCredentials $credentialValue -}}
        {{- fail (printf "%s must be distinct from %s" $credentialName (get $seenMinutesCredentials $credentialValue)) -}}
        {{- end -}}
        {{- $_ := set $seenMinutesCredentials $credentialValue $credentialName -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if $minutesFinalized -}}
  {{- $finalizedUrlRaw := toString (.Values.minutes.finalized.url | default "") -}}
  {{- $finalizedKeyIdRaw := toString (.Values.minutes.finalized.keyId | default "") -}}
  {{- $finalizedUrl := trim $finalizedUrlRaw -}}
  {{- $finalizedKeyId := trim $finalizedKeyIdRaw -}}
  {{- if or (ne $finalizedUrlRaw $finalizedUrl) (ne $finalizedKeyIdRaw $finalizedKeyId) -}}
  {{- fail "Minutes finalized URL and key identifier must not contain outer whitespace" -}}
  {{- end -}}
  {{- if eq $finalizedUrl "" -}}
  {{- fail "minutes.finalized.enabled requires minutes.finalized.url" -}}
  {{- end -}}
  {{- if not (regexMatch "^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[^?#]*)?$" $finalizedUrl) -}}
  {{- fail "minutes.finalized.url must be an unambiguous HTTP(S) URL without credentials, query, or fragment" -}}
  {{- end -}}
  {{- $finalizedWithoutScheme := regexReplaceAll "^https?://" $finalizedUrl "" -}}
  {{- $finalizedAuthority := first (splitList "/" $finalizedWithoutScheme) -}}
  {{- $finalizedHostPort := splitList ":" $finalizedAuthority -}}
  {{- if eq (len $finalizedHostPort) 2 -}}
    {{- $finalizedPort := atoi (index $finalizedHostPort 1) -}}
    {{- if or (lt $finalizedPort 1) (gt $finalizedPort 65535) -}}
    {{- fail "minutes.finalized.url port must be in 1..65535" -}}
    {{- end -}}
  {{- end -}}
  {{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" $finalizedKeyId) -}}
  {{- fail "minutes.finalized.enabled requires minutes.finalized.keyId" -}}
  {{- end -}}
  {{- if and (eq $operatorSecretRef "") (eq $minutesFinalizedSecret "") -}}
  {{- fail "minutes.finalized.enabled requires secrets.minutesFinalizedSecret or secrets.existingSecretName" -}}
  {{- end -}}
  {{- if and (eq $operatorSecretRef "") (ne $minutesFinalizedSecretRaw $minutesFinalizedSecret) -}}
  {{- fail "secrets.minutesFinalizedSecret must not contain outer whitespace" -}}
  {{- end -}}
  {{- if and (eq $operatorSecretRef "") (not (regexMatch $boundedOperatorSecret $minutesFinalizedSecret)) -}}
  {{- fail "secrets.minutesFinalizedSecret must contain 32..512 unpadded printable-ASCII characters" -}}
  {{- end -}}
  {{- if and (eq $operatorSecretRef "") (or (has $minutesFinalizedSecret $platformCredentials) (and $minutesRead (eq $minutesFinalizedSecret $minutesReadToken)) (and $minutesErasure (or (eq $minutesFinalizedSecret $agentErasureSecret) (eq $minutesFinalizedSecret $minutesErasureSecret) (and (ne $previousMinutesErasureSecret "") (eq $minutesFinalizedSecret $previousMinutesErasureSecret))))) -}}
  {{- fail "secrets.minutesFinalizedSecret must be distinct from authentication, read, and erasure secrets" -}}
  {{- end -}}
{{- end -}}
{{- if and (or $hardened $minutesErasure) (not .Values.secrets.existingSecretName) -}}
  {{- $admin := lower (trim (toString .Values.secrets.adminApiToken)) -}}
  {{- $internal := lower (trim (toString .Values.secrets.internalApiSecret)) -}}
  {{- $runtimeControl := lower (trim (toString .Values.secrets.runtimeControlSecret)) -}}
  {{- $runtimeCallback := lower (trim (toString .Values.secrets.runtimeCallbackSecret)) -}}
  {{- $meetingToken := lower (trim (toString .Values.secrets.meetingTokenSecret)) -}}
  {{- $gatewayIdentity := lower (trim (toString .Values.secrets.gatewayIdentitySecret)) -}}
  {{- $redis := lower (trim (toString .Values.secrets.redisPassword)) -}}
  {{- $minioAccess := lower (trim (toString .Values.secrets.minioAccessKey)) -}}
  {{- $minioSecret := lower (trim (toString .Values.secrets.minioSecretKey)) -}}
  {{- $dispatch := lower (trim (toString .Values.secrets.dispatchSigningKey)) -}}
  {{- $nextauth := lower (trim (toString .Values.secrets.nextauthSecret)) -}}
  {{- if or (eq $admin "") (has $admin (list "change_me" "changeme" "dev-admin-token" "test-admin-token" "your_admin_api_key_here")) -}}
  {{- fail "public/staging deployments require a non-placeholder secrets.adminApiToken or secrets.existingSecretName" -}}
  {{- end -}}
  {{- if or (eq $internal "") (has $internal (list "vexa-internal-secret" "lite-internal-secret" "dev-internal-secret")) -}}
  {{- fail "public/staging deployments require a non-placeholder secrets.internalApiSecret or secrets.existingSecretName" -}}
  {{- end -}}
  {{- if or (eq $runtimeControl "") (has $runtimeControl (list "vexa-runtime-control-secret" "lite-runtime-control-secret" "dev-runtime-control-secret")) -}}
  {{- fail "public/staging deployments require a non-placeholder secrets.runtimeControlSecret or secrets.existingSecretName" -}}
  {{- end -}}
  {{- if or (eq $runtimeCallback "") (has $runtimeCallback (list "vexa-runtime-callback-secret" "lite-runtime-callback-secret" "dev-runtime-callback-secret")) -}}
  {{- fail "public/staging deployments require a non-placeholder secrets.runtimeCallbackSecret or secrets.existingSecretName" -}}
  {{- end -}}
  {{- if or (eq $meetingToken "") (has $meetingToken (list "vexa-meeting-token-secret" "lite-meeting-token-secret" "dev-meeting-token-secret")) -}}
  {{- fail "public/staging deployments require a non-placeholder secrets.meetingTokenSecret or secrets.existingSecretName" -}}
  {{- end -}}
  {{- if or (eq $gatewayIdentity "") (has $gatewayIdentity (list "vexa-gateway-identity-secret-local-v1" "lite-gateway-identity-secret-local-v1" "dev-gateway-identity-secret")) -}}
  {{- fail "public/staging deployments require a non-placeholder secrets.gatewayIdentitySecret or secrets.existingSecretName" -}}
  {{- end -}}
  {{- if or (eq $redis "") (has $redis (list "vexa-redis-password" "lite-redis-password" "dev-redis-password")) -}}
  {{- fail "public/staging deployments require a non-placeholder secrets.redisPassword or secrets.existingSecretName" -}}
  {{- end -}}
  {{- if and .Values.minio.enabled (or (eq $minioAccess "") (has $minioAccess (list "vexa-access-key" "minioadmin" "change_me" "changeme"))) -}}
  {{- fail "public/staging in-chart MinIO requires a non-placeholder secrets.minioAccessKey or secrets.existingSecretName" -}}
  {{- end -}}
  {{- if and .Values.minio.enabled (or (eq $minioSecret "") (has $minioSecret (list "vexa-secret-key" "vexa-secret-key-local" "minioadmin" "change_me" "changeme"))) -}}
  {{- fail "public/staging in-chart MinIO requires a non-placeholder secrets.minioSecretKey or secrets.existingSecretName" -}}
  {{- end -}}
  {{- if or (eq $dispatch "") (has $dispatch (list "dev-dispatch-signing-key" "vexa-dispatch-signing-key")) -}}
  {{- fail "public/staging deployments require a non-placeholder secrets.dispatchSigningKey or secrets.existingSecretName" -}}
  {{- end -}}
  {{- if or (eq $nextauth "") (has $nextauth (list "dev-nextauth-secret" "vexa-lite-nextauth-secret")) -}}
  {{- fail "public/staging deployments require a non-placeholder secrets.nextauthSecret or secrets.existingSecretName" -}}
  {{- end -}}
  {{- if $googleOAuth -}}
    {{- $clientId := lower (trim (toString .Values.secrets.googleClientId)) -}}
    {{- $clientSecret := lower (trim (toString .Values.secrets.googleClientSecret)) -}}
    {{- if or (eq $clientId "") (has $clientId (list "change_me" "changeme" "google-client-id" "your_google_client_id")) -}}
    {{- fail "public/staging Google OAuth requires a non-placeholder secrets.googleClientId or secrets.existingSecretName" -}}
    {{- end -}}
    {{- if or (eq $clientSecret "") (has $clientSecret (list "change_me" "changeme" "google-client-secret" "your_google_client_secret")) -}}
    {{- fail "public/staging Google OAuth requires a non-placeholder secrets.googleClientSecret or secrets.existingSecretName" -}}
    {{- end -}}
  {{- end -}}
  {{- if $microsoftOAuth -}}
    {{- $clientId := lower (trim (toString .Values.secrets.microsoftClientId)) -}}
    {{- $clientSecret := lower (trim (toString .Values.secrets.microsoftClientSecret)) -}}
    {{- if or (eq $clientId "") (has $clientId (list "change_me" "changeme" "microsoft-client-id" "your_microsoft_client_id")) -}}
    {{- fail "public/staging Microsoft OAuth requires a non-placeholder secrets.microsoftClientId or secrets.existingSecretName" -}}
    {{- end -}}
    {{- if or (eq $clientSecret "") (has $clientSecret (list "change_me" "changeme" "microsoft-client-secret" "your_microsoft_client_secret")) -}}
    {{- fail "public/staging Microsoft OAuth requires a non-placeholder secrets.microsoftClientSecret or secrets.existingSecretName" -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if not .Values.secrets.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vexa.componentName" (list . "secrets") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_API_TOKEN: {{ .Values.secrets.adminApiToken | quote }}
  INTERNAL_API_SECRET: {{ .Values.secrets.internalApiSecret | default "vexa-internal-secret" | quote }}
  RUNTIME_CONTROL_SECRET: {{ .Values.secrets.runtimeControlSecret | default "vexa-runtime-control-secret" | quote }}
  RUNTIME_CALLBACK_SECRET: {{ .Values.secrets.runtimeCallbackSecret | default "vexa-runtime-callback-secret" | quote }}
  MEETING_TOKEN_SECRET: {{ .Values.secrets.meetingTokenSecret | quote }}
  GATEWAY_IDENTITY_SECRET: {{ .Values.secrets.gatewayIdentitySecret | quote }}
  {{- if .Values.secrets.gatewayIdentityPreviousSecret }}
  GATEWAY_IDENTITY_PREVIOUS_SECRET: {{ .Values.secrets.gatewayIdentityPreviousSecret | quote }}
  {{- end }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  REDIS_URL: {{ include "vexa.redisUrl" . | quote }}
  {{- if .Values.minio.enabled }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
  {{- end }}
  TRANSCRIPTION_SERVICE_TOKEN: {{ .Values.secrets.transcriptionServiceToken | quote }}
  VEXA_DISPATCH_SIGNING_KEY: {{ .Values.secrets.dispatchSigningKey | default "dev-dispatch-signing-key" | quote }}
  NEXTAUTH_SECRET: {{ .Values.secrets.nextauthSecret | default "dev-nextauth-secret" | quote }}
  {{- if $minutesRead }}
  ZAKI_READ_TOKEN_MINUTES: {{ .Values.secrets.minutesReadToken | quote }}
  {{- end }}
  {{- if $minutesErasure }}
  ZAKI_MINUTES_HUB_TOKEN: {{ .Values.secrets.minutesHubToken | quote }}
  ZAKI_AGENT_ERASURE_VERIFICATION_SECRET: {{ .Values.secrets.agentErasureHmacSecret | quote }}
  {{- if ne $previousAgentErasureKeyId "" }}
  ZAKI_AGENT_ERASURE_PREVIOUS_VERIFICATION_SECRET: {{ .Values.secrets.agentErasurePreviousVerificationSecret | quote }}
  {{- end }}
  ZAKI_MINUTES_ERASURE_SIGNING_SECRET: {{ .Values.secrets.minutesErasureSigningSecret | quote }}
  {{- if ne $previousMinutesErasureKeyId "" }}
  ZAKI_MINUTES_ERASURE_PREVIOUS_VERIFICATION_SECRET: {{ .Values.secrets.minutesErasurePreviousVerificationSecret | quote }}
  {{- end }}
  {{- end }}
  {{- if $minutesFinalized }}
  ZAKI_MINUTES_FINALIZED_SECRET: {{ .Values.secrets.minutesFinalizedSecret | quote }}
  {{- end }}
  {{- if $googleOAuth }}
  GOOGLE_CLIENT_ID: {{ required "secrets.googleClientId is required when terminal.oauth.google.enabled=true" .Values.secrets.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ required "secrets.googleClientSecret is required when terminal.oauth.google.enabled=true" .Values.secrets.googleClientSecret | quote }}
  {{- end }}
  {{- if $microsoftOAuth }}
  MICROSOFT_CLIENT_ID: {{ required "secrets.microsoftClientId is required when terminal.oauth.microsoft.enabled=true" .Values.secrets.microsoftClientId | quote }}
  MICROSOFT_CLIENT_SECRET: {{ required "secrets.microsoftClientSecret is required when terminal.oauth.microsoft.enabled=true" .Values.secrets.microsoftClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.botApiKey }}
  VEXA_BOT_API_KEY: {{ .Values.secrets.botApiKey | quote }}
  {{- end }}
  {{- if .Values.terminal.sharedKeyMode }}
  TERMINAL_SHARED_API_KEY: {{ required "secrets.terminalSharedApiKey is required when terminal.sharedKeyMode=true" .Values.secrets.terminalSharedApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicAuthToken }}
  ANTHROPIC_AUTH_TOKEN: {{ .Values.secrets.anthropicAuthToken | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicBaseUrl }}
  ANTHROPIC_BASE_URL: {{ .Values.secrets.anthropicBaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.claudeCodeOauthToken }}
  CLAUDE_CODE_OAUTH_TOKEN: {{ .Values.secrets.claudeCodeOauthToken | quote }}
  {{- end }}
{{- end }}
---
{{- if and .Values.postgres.enabled .Values.postgres.createCredentialsSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vexa.postgresCredentialsSecretName" . }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
{{- end }}
